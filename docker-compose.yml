# Agent Nexus Gateway — Docker Compose
# Usage: docker compose up

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-nexus-gateway:latest
    container_name: anx-gateway
    ports:
      - "8787:8787"   # Gateway API
      - "3000:3000"   # Dashboard
    environment:
      NODE_ENV: production
      PORT: 8787
      ANX_CONFIG: /etc/agent-nexus/config.json
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # DeepSeek
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # OpenRouter
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Google
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Groq
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Mistral
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      # xAI
      XAI_API_KEY: ${XAI_API_KEY:-}
      # Vault
      AGENT_NEXUS_VAULT_KEY: ${AGENT_NEXUS_VAULT_KEY:-}
    volumes:
      - ./apps/gateway/agent-nexus.config.example.json:/etc/agent-nexus/config.json:ro
      - anx-vault:/var/lib/agent-nexus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - anx

  # Optional: Prometheus for metrics scraping
  prometheus:
    image: prom/prometheus:latest
    container_name: anx-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - anx-prometheus:/prometheus
    restart: unless-stopped
    networks:
      - anx
    profiles: ["observability"]

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: anx-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - anx-grafana:/var/lib/grafana
    restart: unless-stopped
    networks:
      - anx
    profiles: ["observability"]

volumes:
  anx-vault:
  anx-prometheus:
  anx-grafana:

networks:
  anx:
    driver: bridge
