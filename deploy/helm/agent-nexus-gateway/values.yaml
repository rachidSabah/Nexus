replicaCount: 3

image:
  repository: ghcr.io/rachidsabah/agent-nexus-gateway
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  apiPort: 8787
  dashboardPort: 3000

ingress:
  enabled: true
  className: nginx
  host: nexus.example.com
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Provider API keys — set via --set or values.yaml
providers:
  openai:
    apiKey: ""
  anthropic:
    apiKey: ""
  deepseek:
    apiKey: ""
  openrouter:
    apiKey: ""
  google:
    apiKey: ""
  groq:
    apiKey: ""

security:
  vaultKey: ""
  adminApiKey: ""

routing:
  strategy: weighted
  failureThreshold: 5
  cooldownMs: 30000
  maxFailovers: 3

network:
  doh:
    enabled: false
    url: https://cloudflare-dns.com/dns-query
