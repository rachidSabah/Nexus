apiVersion: v1
kind: Namespace
metadata:
  name: agent-nexus
  labels:
    app.kubernetes.io/name: agent-nexus-gateway
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-nexus-config
  namespace: agent-nexus
data:
  config.json: |
    {
      "server": { "port": 8787, "host": "0.0.0.0", "cors": { "origin": "*", "credentials": false } },
      "routing": { "strategy": "weighted", "failureThreshold": 5, "failureWindowMs": 60000, "cooldownMs": 30000, "maxFailovers": 3 },
      "security": { "principals": [{ "id": "admin", "roles": ["admin"] }] },
      "network": { "proxies": [], "doh": { "url": "https://cloudflare-dns.com/dns-query", "enabled": false } },
      "mcp": { "servers": [] },
      "endpoints": []
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-nexus-secrets
  namespace: agent-nexus
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  DEEPSEEK_API_KEY: ""
  OPENROUTER_API_KEY: ""
  GOOGLE_API_KEY: ""
  GROQ_API_KEY: ""
  AGENT_NEXUS_VAULT_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-nexus-gateway
  namespace: agent-nexus
  labels:
    app.kubernetes.io/name: agent-nexus-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-nexus-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-nexus-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/rachidsabah/agent-nexus-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 8787
            - name: dashboard
              containerPort: 3000
          envFrom:
            - secretRef:
                name: agent-nexus-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: ANX_CONFIG
              value: /etc/agent-nexus/config.json
            - name: PORT
              value: "8787"
          volumeMounts:
            - name: config
              mountPath: /etc/agent-nexus
              readOnly: true
            - name: vault
              mountPath: /var/lib/agent-nexus
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: agent-nexus-config
        - name: vault
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-nexus-gateway
  namespace: agent-nexus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-nexus-gateway
  ports:
    - name: api
      port: 8787
      targetPort: api
    - name: dashboard
      port: 3000
      targetPort: dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: agent-nexus-gateway-headless
  namespace: agent-nexus
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: agent-nexus-gateway
  ports:
    - name: api
      port: 8787
    - name: dashboard
      port: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-nexus-gateway
  namespace: agent-nexus
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-nexus-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-nexus-gateway
  namespace: agent-nexus
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Connection "";
      proxy_http_version 1.1;
      chunked_transfer_encoding off;
spec:
  ingressClassName: nginx
  rules:
    - host: nexus.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-nexus-gateway
                port:
                  number: 3000
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: agent-nexus-gateway
                port:
                  number: 8787
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: agent-nexus-gateway
                port:
                  number: 8787
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: agent-nexus-gateway
                port:
                  number: 8787
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-nexus-gateway
  namespace: agent-nexus
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-nexus-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-nexus-gateway
  namespace: agent-nexus
---
apiVersion: v1
kind: PodSecurityPolicy
metadata:
  name: agent-nexus-gateway
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - configMap
    - secret
    - emptyDir
  runAsUser:
    rule: MustRunAsNonRoot
  seLinux:
    rule: RunAsAny
  supplementalGroups:
    rule: MustRunAs
    ranges:
      - min: 1000
        max: 65535
  fsGroup:
    rule: MustRunAs
    ranges:
      - min: 1000
        max: 65535
