name: Feature request
description: Suggest a new feature or improvement
title: '[feat]: '
labels: ['enhancement', 'triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Routing engine
        - Provider adapters
        - Plugin framework
        - Dashboard
        - CLI
        - MCP
        - A2A
        - Networking
        - Security
        - Observability
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: Willingness to contribute
      options:
        - label: I am willing to submit a PR for this feature
