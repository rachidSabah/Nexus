name: Bug report
description: Report a reproducible bug
title: '[bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Before submitting, please:
        - Search existing issues to avoid duplicates.
        - Make sure you're running the latest version.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Start the gateway with `anx-gateway`
        2. Send a request to `POST /v1/chat/completions` with body `...`
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gateway version
      placeholder: '0.1.0'
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Docker
        - Kubernetes
        - Native (Node 22)
        - Native (Node 20)
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: provider
    attributes:
      label: Provider(s) affected
      placeholder: 'openai, anthropic, ...'
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
  - type: textarea
    id: config
    attributes:
      label: Configuration (redacted)
      render: json
